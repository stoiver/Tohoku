name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Spread over Python versions, which is what spreads numpy versions:
        # the complex-eigenpair bug this suite guards reproduces on numpy
        # 2.5.2 and not on 2.4.6, under both OpenBLAS and Accelerate, so it is
        # the numpy version that decides -- not the OS.  3.12 is pinned
        # because that is where the bug was first hit in the wild.  Both
        # operating systems stay in the matrix so the BLAS difference remains
        # covered, but they are not what catches this one.
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # The Okada and KL modules need only these -- no ANUGA -- so the whole
        # suite runs in a few seconds on a bare environment.
        run: python -m pip install --upgrade pip numpy scipy matplotlib pytest

      - name: Show the BLAS/LAPACK numpy is using
        # Printed on every run: when a platform-specific numerical failure
        # appears, this is the first thing worth knowing.
        run: python -c "import numpy; numpy.show_config()"

      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: python -m pytest tests -v
